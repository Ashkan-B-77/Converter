<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Case Converter</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel='stylesheet' href='style.css'>
    <!-- added converter.js file here too so the content of both this and script.js file are global (So the Jest test works) -->
    <script defer src="converter.js"></script> 
    <script defer src="script.js"></script>
</head>
<body>
    <h1 id="mainHeading">Case Converter</h1>
    <hr>

    <div id="inputArea"> <!-- wrap the input and buttons in div elements so you can adjust the buttons' position -->
        <textarea id="inputBox" placeholder="Type or paste your text..."></textarea> <!-- use textarea instead of input for large text inputs -->
        <div id="buttonArea">
            <button type="button" id="convertUpperBtn">TO UPPERCASE</button>
            <button type="button" id="convertLowerBtn">to lowercase</button>
        </div>
    </div>

    <span id="warningMsg"></span>

    <ul id="textList"></ul>    
</body>
</html>
