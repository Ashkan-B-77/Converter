<!DOCTYPE html>
<html lang='en'>
<head>

    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Case Converter</title>
    <link rel='stylesheet' href='style.css'>
    <script defer src="script.js"></script>
</head>
<body>
    <h1 id="mainHeading">Case Converter</h1>
    <hr>

    <ul id="textList"></ul>
